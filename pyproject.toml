[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guided-vision-encoder"
version = "0.1.0"
description = "PyTorch scaffold for Language-Instructed Vision Embeddings (LIVE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
